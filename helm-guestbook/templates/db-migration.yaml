apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration-Job
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hoo-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: busybox
          command::
            - "sh"
            - "-c"
            - "echo 'Rnning db migration...'; sleep 10; echo 'Done!'"